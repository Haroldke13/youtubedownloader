{% extends "base.html" %}
{% block content %}
<style>
    .download-form {
        max-width: 600px;
        margin: 0 auto;
    }
    .form-title {
        font-size: 2.5rem;
        color: var(--primary-color);
        text-align: center;
        margin-bottom: 40px;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    .form-group {
        margin-bottom: 30px;
    }
    .form-label {
        display: block;
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 10px;
        color: var(--text-color);
    }
    .form-input {
        width: 100%;
        padding: 15px 20px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: var(--border-radius);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-color);
        font-size: 1rem;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
    }
    .form-input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.2);
        transform: translateY(-2px);
    }
    .form-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }
    .submit-btn {
        width: 100%;
        padding: 18px 30px;
        background: linear-gradient(135deg, var(--primary-color) 0%, #cc0000 100%);
        color: white;
        border: none;
        border-radius: var(--border-radius);
        font-size: 1.2rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
    }
    .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(255, 0, 0, 0.4);
    }
    .submit-btn:active {
        transform: translateY(-1px);
    }
    .submit-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.6s;
    }
    .submit-btn:hover::before {
        left: 100%;
    }
    .form-note {
        text-align: center;
        margin-top: 20px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
    }
    @media (max-width: 768px) {
        .form-title {
            font-size: 2rem;
        }
        .form-input {
            padding: 12px 16px;
        }
        .submit-btn {
            padding: 15px 25px;
            font-size: 1.1rem;
        }
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="download-form">
    <h1 class="form-title">🚀 Download YouTube Playlist</h1>
    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="url">YouTube Playlist URL</label>
            <input type="url" id="url" name="url" class="form-input" placeholder="https://www.youtube.com/playlist?list=..." required>
        </div>

        
        <script>
                async function download() {
                const url = document.getElementById("url").value;

                const response = await fetch("/download", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url })
                });

                const blob = await response.blob();
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "video.mp4";
                a.click();
                }
        </script>
        <script>
            // Get downloads folder from data attribute
            const downloadsFolderData = document.getElementById('downloads-folder-data');
            const DOWNLOADS_FOLDER = downloadsFolderData ? downloadsFolderData.getAttribute('data-path') : '';

            // Fill custom input with default when requested
            document.addEventListener('DOMContentLoaded', function() {
                const useBtn = document.getElementById('use-default-btn');
                const customInput = document.getElementById('custom_folder');
                if (useBtn && customInput && DOWNLOADS_FOLDER) {
                    useBtn.addEventListener('click', function() {
                        customInput.value = DOWNLOADS_FOLDER;
                        alert('Default downloads path filled');
                    });
                }
            });
        </script>

        <button onclick="download()" type="submit" class="submit-btn">⚡ Start Download</button>
    </form>
    <p class="form-note">Enter a valid YouTube playlist URL and choose a folder name to begin downloading.</p>
</div>
{% endblock %}
